<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de pedidos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-black text-light" >
    <header class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                <img src="img/Logo moderno e industrial de pedidos.png"
                height="50">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#home">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#pedidos">Pedido</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#registros">Registros</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#orçamentos">Orçamentos</a>
                    </li>

                </ul>

                <form class="d-flex">

                    <input class="form-control me-2" type="search" placeholder="Buscar pedidos...">
                    <button class="btn btn-warning">Buscar</button>

                </form>

            </div>

        </div>
    </header>


    <main class="container my-5">

                <form class="card p-4 bg-danger text-light">
                    <h2>Novo Pedido</h2>

                    <label>Cliente:</label><br>
                    <input type="text" class="form-control" name="Cliente"><br>

                    <label>Serviços:</label><br>
                    <input type="text" class="form-control" name="Serviço"><br>

                    <label>Prazo:</label><br>
                    <input type="date" class="form-control" name="Prazo"><br>

                    <label>Status:</label><br>
                    <select type="status" class="form-control" name="Status">
                        <option class="andamento">Em andamento</option>
                        <option class="pronto">Pronto</option>
                        <option class="entregue">Entregue</option>
                        <option class="pago">Pago</option>
                    </select>  

                    <label>Endereço:</label><br>
                    <textarea type="descrição" class="form-control" name="Descrição"></textarea><br>

                    <label>imagem:</label><br>
                    <input type="file" class="form-control"><br>

                    <button type="submit" class="btn btn-warning w-100">Salvar</button>
                </form>
            </div>
    </main>

    <footer class="bg-dark text-light mt-5">

        <div class="container py-4">

            <div class="row">

                <div class="col-md-3">
                    <img src="img/Logo moderno e industrial de pedidos.png" height="50">
                </div>

                <div class="col-md-3">

                    <h5>Links</h5>

                    <ul class="list-unstyled">

                        <li><a class="text-light" href="#">Home</a></li>
                        <li><a class="text-light" href="#">Pedido</a></li>
                        <li><a class="text-light" href="#">Registros</a></li>

                    </ul>

                </div>

                <div class="col-md-3">

                    <h5>Contato</h5>

                    <p>📞 (38) 99999-9999</p>
                    <p>📧 contato@gestorpedidos.com</p>

                </div>

                <div class="col-md-3">

                    <h5>Redes</h5>

                    <p>Facebook</p>
                    <p>Instagram</p>
                    <p>WhatsApp</p>

                </div>

            </div>

        </div>

    </footer>
    
    <script src="./js/app.js"></script>
</body>
</html>
