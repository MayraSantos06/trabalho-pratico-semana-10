<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pedido</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-black text-light" >
    <header class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                <img src="img/Logo moderno e industrial de pedidos.png"
                height="50">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="d-flex justify-content-between align-item-center mb-4">
                        <a class="btn btn-warning" href="novoPedido.html">+ Novo Pedido</a>
                    </li>

                </ul>

                <form class="d-flex">

                    <input class="form-control me-2" type="search" placeholder="Buscar pedidos...">
                    <button class="btn btn-warning">Buscar</button>

                </form>

            </div>

        </div>
    </header>


    <main class="container my-5 w-100">
        <form id="formEditar" class=" p-4 bg-dark text-light border border-warning shadow-lg mx-auto container-fluid">
                    
            <h3>Dados do Cliente</h3>
            <div class="row ">

                <div class="col-md-6">
                    <label>Cliente:</label>
                    <input type="text" class="form-control mb-3" id="cliente">
                </div>
                <div class="col-md-6">
                    <label>Telefone:</label>
                    <input type="text" class="form-control mb-3" id="telefone">
                </div>
                <div class="col-12">
                    <label>Endereço:</label>
                    <input type="text" class="form-control mb-3" id="endereco">
                </div>

                <h3>Dados do Pedido</h3>
                <div class="col-md-4">
                    <label>Serviço:</label>
                    <select class="form-control mb-3" id="servico">
                        <option class="nenhum"> </option>
                        <option class="portao">Portão</option>
                        <option class="janela">Janela</option>
                        <option class="corrimao">Corrimão</option>
                        <option class="grade">Grade</option>
                    </select> 
                </div>
                <div class="col-md-4">
                    <label>Material:</label><br>
                    <select class="form-control mb-3" id="material">
                        <option class="nenhum"> </option>
                        <option class="aço">Aço inox</option>
                        <option class="aço">Aço Carbono</option>
                        <option class="aço">Aço Galvanizado</option>
                        <option class="aluminio">Aluminio</option>
                    </select> 
                </div>
                <div class="col-md-4">
                    <label>Cor:</label>
                    <input type="text" class="form-control mb-3" id="cor">
                </div>
                <div class="col-md-4">
                    <label>Medidas:</label>
                    <input type="text" class="form-control mb-3" id="medidas" placeholder="ex: 2,00m x 1,00m">
                </div>
                <div class="col-md-4">
                    <label>Quantidade:</label>
                    <input type="number" class="form-control mb-3" id="quantidade">
                </div>
                <div class="col-md-4">
                    <label>Data de entrega:</label>
                    <input type="date" class="form-control mb-3" id="dataEntrega">
                </div>
                <div class="col-12">
                    <label>Observações:</label>
                    <textarea type="text" class="form-control mb-3" id="observacoes"></textarea>
                </div>  
                
                <div class="col-md-6">
                    <label>Responsável:</label>
                    <select type="status" class="form-control mb-3" id="responsavel">
                        <option class="nome"> </option>
                        <option class="nome">Lady Gaga</option>
                        <option class="nome">Xuxa</option>
                        <option class="nome">Luciano Huck</option>
                    </select> 
                </div>
                <div class="col-md-6">   
                    <label>Orçamento:</label>
                    <input type="number" step="0.01" min="0.00" class="form-control mb-3" id="orcamento">
                </div> 
                <button type="submit" class="btn btn-warning w-100 mb-3">Salvar Alterações</button>
            </div>
        </form>
    </main>

    <footer class="bg-dark text-light mt-5">

        <div class="container py-4">

            <div class="row">

                <div class="col-md-3">
                    <img src="img/Logo moderno e industrial de pedidos.png" height="50">
                </div>

                <div class="col-md-3">

                    <h5>Links</h5>

                    <ul class="list-unstyled">

                        <li><a class="text-light" href="#">Home</a></li>
                        <li><a class="text-light" href="#">Pedido</a></li>
                        <li><a class="text-light" href="#">Registros</a></li>

                    </ul>

                </div>

                <div class="col-md-3">

                    <h5>Contato</h5>

                    <p>📞 (38) 99999-9999</p>
                    <p>📧 contato@gestorpedidos.com</p>

                </div>

                <div class="col-md-3">

                    <h5>Redes</h5>

                    <p>Facebook</p>
                    <p>Instagram</p>
                    <p>WhatsApp</p>

                </div>

            </div>

        </div>

    </footer>
    
    <script src="./js/app.js"></script>
</body>
</html>
